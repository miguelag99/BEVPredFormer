# @package _global_

# Short range setting: 30x30 m BEV at 0.15 m (200x200 cells).
# Usage: python bevpredformer/{train,val}.py experiment=short_range

data:
  grid:
    xbound: [-15.0, 15.0, 0.15]
    ybound: [-15.0, 15.0, 0.15]

model:
  net:
    projector:
      spatial_bounds: [-14.925, 14.925, -14.925, 14.925, -3.375, 5.375]

  postproc_kwargs:
    conf_threshold: 0.1
    nms_kernel_size: 13
